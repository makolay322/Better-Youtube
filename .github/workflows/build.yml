name: Build & lint

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build store packages
        run: python3 tools/build.py --unpacked
      - name: Lint Firefox package (web-ext)
        run: npx --yes web-ext@8 lint --source-dir dist/unpacked/firefox --warnings-as-errors
      - uses: actions/upload-artifact@v4
        with:
          name: kolay-youtube-packages
          path: dist/*.zip
      - name: Attach packages to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
