<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Better Youtube – Ayarlar</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header>
    <h1>Better Youtube</h1>
    <input id="search" type="search" placeholder="Ayarlarda ara…" autocomplete="off">
    <div class="hdr-actions">
      <button id="export">Dışa aktar</button>
      <button id="import">İçe aktar</button>
      <button id="reset" class="danger">Tümünü sıfırla</button>
      <input id="file" type="file" accept="application/json" hidden>
    </div>
  </header>
  <div class="layout">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
  <div id="toast" role="status"></div>
  <script src="../shared/schema.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="options.js"></script>
</body>
</html>
