<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kolay Youtube – Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header>
    <h1 class="brand"><img src="../icons/icon32.png" alt="" width="22" height="22">Kolay Youtube</h1>
    <input id="search" type="search" placeholder="Search settings…" autocomplete="off">
    <div class="hdr-actions">
      <button id="export">Export</button>
      <button id="import">Import</button>
      <button id="reset" class="danger">Reset all</button>
      <input id="file" type="file" accept="application/json" hidden>
    </div>
  </header>
  <div class="layout">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
  <div id="toast" role="status"></div>
  <script src="../shared/schema.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="options.js"></script>
</body>
</html>
