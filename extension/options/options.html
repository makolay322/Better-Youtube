<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kolay for YouTube</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header>
    <h1 class="brand"><img src="../icons/icon32.png" alt="" width="22" height="22">Kolay for YouTube</h1>
    <span id="saved" class="saved" role="status" aria-live="polite" data-i18n="ui.saved">Saved</span>
    <div class="search-wrap">
      <input id="search" type="search" data-i18n-ph="ui.search" placeholder="Search settings…" autocomplete="off">
      <kbd class="search-hint" aria-hidden="true">/</kbd>
    </div>
    <label class="lang" data-i18n-title="ui_lang" title="Language">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.93 6h-2.95a15.7 15.7 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.93 8ZM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96ZM4.26 14a8.2 8.2 0 0 1 0-4h3.38a16.5 16.5 0 0 0 0 4H4.26Zm.81 2h2.95c.32 1.25.78 2.45 1.38 3.56A7.99 7.99 0 0 1 5.07 16Zm2.95-8H5.07a7.99 7.99 0 0 1 4.33-3.56A15.7 15.7 0 0 0 8.02 8ZM12 19.96A14.1 14.1 0 0 1 10.09 16h3.82A14.1 14.1 0 0 1 12 19.96ZM14.34 14H9.66a14.7 14.7 0 0 1 0-4h4.68a14.7 14.7 0 0 1 0 4Zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95a8.03 8.03 0 0 1-4.33 3.56ZM16.36 14a16.5 16.5 0 0 0 0-4h3.38a8.2 8.2 0 0 1 0 4h-3.38Z"/></svg>
      <select id="lang"></select>
    </label>
    <div class="hdr-actions">
      <button id="export" data-i18n="ui.export">Export</button>
      <button id="import" data-i18n="ui.import">Import</button>
      <button id="reset" class="danger" data-i18n="ui.resetAll">Reset all</button>
      <input id="file" type="file" accept="application/json" hidden>
    </div>
  </header>
  <div class="layout">
    <nav id="nav"></nav>
    <main>
      <div id="main"></div>
      <p id="noresults" class="noresults" hidden></p>
      <footer class="foot">
        <span>Kolay for YouTube <span id="ver"></span></span>
        <a href="https://makolay322.github.io/Better-Youtube/" target="_blank" rel="noopener" data-i18n="ui.website">Website</a>
        <a href="https://makolay322.github.io/Better-Youtube/privacy.html" target="_blank" rel="noopener" data-i18n="ui.privacy">Privacy</a>
        <a href="https://github.com/makolay322/Better-Youtube/issues" target="_blank" rel="noopener" data-i18n="ui.report">Report a problem</a>
      </footer>
    </main>
  </div>
  <div id="toast" role="status"></div>
  <script src="../shared/schema.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/locales/tr.js"></script>
  <script src="../shared/locales/es.js"></script>
  <script src="../shared/locales/pt.js"></script>
  <script src="../shared/locales/de.js"></script>
  <script src="../shared/locales/fr.js"></script>
  <script src="../shared/locales/ru.js"></script>
  <script src="../shared/locales/ja.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="options.js"></script>
</body>
</html>
